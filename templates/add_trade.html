<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YourStats - Add Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        appBg: '#05070B',
                        surface: '#11151F',
                        surfaceHover: '#181E2C',
                        primary: '#6366F1',
                        success: '#10B981',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #05070B; }
        ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-panel {
            background: rgba(17, 21, 31, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            border-color: rgba(99, 102, 241, 0.2);
            box-shadow: 0 12px 35px -10px rgba(99, 102, 241, 0.15);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background-color: #05070B;
        }
        .bg-glow-1 {
            position: absolute; top: -10%; left: 20%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.05) 40%, transparent 70%);
            border-radius: 50%; pointer-events: none; filter: blur(60px);
        }
        .bg-glow-2 {
            position: absolute; bottom: -15%; right: 10%; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, rgba(59, 130, 246, 0.03) 50%, transparent 70%);
            border-radius: 50%; pointer-events: none; filter: blur(80px);
        }
        .bg-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 20%, black 40%, transparent 80%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-transparent text-gray-300 min-h-screen font-sans antialiased selection:bg-primary/30 selection:text-white">

    <div class="app-background">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- ნავიგაცია -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-white/5 !transform-none !shadow-none">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="{{ url_for('index') }}" class="flex items-center gap-3 group focus:outline-none">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-xl shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                        <i data-lucide="line-chart" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <span class="font-bold text-xl text-white tracking-tight group-hover:text-indigo-300 transition-colors">Your<span class="gradient-text">Stats</span></span>
                        <div class="text-[10px] text-gray-400 font-medium tracking-wide -mt-1">Created by Sandrika</div>
                    </div>
                </a>
                
                <!-- დესკტოპ მენიუ -->
                <div class="hidden md:flex items-center gap-6">
                    <a href="{{ url_for('index') }}" class="text-gray-400 flex items-center gap-2 font-medium transition hover:text-white">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> <span data-i18n="nav_dashboard">Dashboard</span>
                    </a>
                    <a href="{{ url_for('trades_list') }}" class="text-gray-400 flex items-center gap-2 font-medium transition hover:text-white">
                        <i data-lucide="list" class="w-4 h-4"></i> <span data-i18n="nav_history">History</span>
                    </a>
                    <a href="{{ url_for('analytics') }}" class="text-gray-400 flex items-center gap-2 font-medium transition hover:text-white">
                        <i data-lucide="pie-chart" class="w-4 h-4"></i> <span data-i18n="nav_analytics">Analytics</span>
                    </a>
                </div>

                <div class="flex items-center gap-2 sm:gap-4">
                    <!-- ენების არჩევანი -->
                    <div class="relative z-30">
                        <button id="langMenuButton" onclick="toggleLangMenu()" class="glass-panel px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white flex items-center gap-2 transition">
                            <i data-lucide="globe" class="w-4 h-4 text-indigo-400"></i>
                            <span id="currentLangLabel">English</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
                        </button>
                        <div id="langDropdown" class="hidden absolute right-0 mt-2 w-40 glass-panel rounded-xl shadow-xl overflow-hidden border border-white/10 py-1">
                            <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-2 transition">
                                🇬🇧 English
                            </button>
                            <button onclick="changeLanguage('ka')" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-2 transition">
                                🇬🇪 ქართული
                            </button>
                            <button onclick="changeLanguage('ru')" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-2 transition">
                                🇷🇺 Русский
                            </button>
                            <button onclick="changeLanguage('es')" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-2 transition">
                                🇪🇸 Español
                            </button>
                        </div>
                    </div>

                    <a href="{{ url_for('index') }}" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 hover:bg-white/10 transition flex items-center gap-1.5 text-sm font-medium">
                        <i data-lucide="arrow-left" class="w-4 h-4 text-indigo-400"></i>
                        <span class="hidden sm:inline" data-i18n="btn_back">Back</span>
                    </a>

                    <div class="h-6 w-[1px] bg-white/10 hidden sm:block"></div>
                    
                    <a href="{{ url_for('logout') }}" class="text-gray-500 hover:text-rose-400 transition p-1" title="გასვლა">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </a>

                    <!-- მობილური მენიუს ჰამბურგერ ღილაკი -->
                    <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white p-2 rounded-xl bg-white/5">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- მობილური ჩამოსაშლელი მენიუ -->
        <div id="mobileMenu" class="hidden md:hidden px-4 pt-2 pb-4 border-t border-white/5 space-y-2 bg-surface">
            <a href="{{ url_for('index') }}" class="block px-3 py-2 rounded-lg text-gray-300 hover:bg-white/5 font-medium flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-indigo-400"></i> Dashboard
            </a>
            <a href="{{ url_for('trades_list') }}" class="block px-3 py-2 rounded-lg text-gray-300 hover:bg-white/5 font-medium flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4 text-indigo-400"></i> History
            </a>
            <a href="{{ url_for('analytics') }}" class="block px-3 py-2 rounded-lg text-gray-300 hover:bg-white/5 font-medium flex items-center gap-2">
                <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-400"></i> Analytics
            </a>
        </div>
    </nav>

    <!-- მთავარი კონტენტი - ტრეიდის დამატების ფორმა -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 animate-fade-in">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-6 h-6 text-indigo-400"></i> <span data-i18n="form_heading">Add New Trade</span>
                </h1>
                <p class="text-xs sm:text-sm text-gray-400 mt-1" data-i18n="form_subtitle">Enter trade operation details for analysis.</p>
            </div>
        </div>

        <div class="glass-panel p-6 sm:p-8 rounded-2xl">
            <form action="{{ url_for('add_trade') }}" method="POST" enctype="multipart/form-data" class="space-y-5">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- თარიღი -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_date">Date</label>
                        <input type="date" name="date" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>

                    <!-- სავაჭრო წყვილი -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_pair">Trading Pair (e.g., EURUSD, BTCUSD)</label>
                        <input type="text" name="pair" placeholder="EURUSD" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono uppercase focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                    <!-- მხარე (LONG/SHORT) -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_direction">Direction</label>
                        <select name="direction" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                            <option value="LONG" class="bg-surface text-success font-semibold">LONG</option>
                            <option value="SHORT" class="bg-surface text-danger font-semibold">SHORT</option>
                        </select>
                    </div>

                    <!-- შესვლის ფასი -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_entry">Entry Price</label>
                        <input type="number" step="any" name="entry_price" placeholder="0.00" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>

                    <!-- გასვლის ფასი -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_exit">Exit Price</label>
                        <input type="number" step="any" name="exit_price" placeholder="0.00" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- PnL ($) -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_pnl">Profit / Loss ($)</label>
                        <input type="number" step="0.01" name="pnl" placeholder="Plus for profit, minus for loss" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>

                    <!-- სქრინშოტი -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_screenshot">Screenshot (Image)</label>
                        <label class="flex flex-col items-center justify-center w-full h-[46px] border border-white/10 border-dashed rounded-xl cursor-pointer bg-black/40 hover:bg-white/[0.04] transition">
                            <div class="flex items-center gap-2 text-gray-400 text-xs px-3">
                                <i data-lucide="upload" class="w-4 h-4 text-indigo-400"></i>
                                <span id="fileName" class="truncate" data-i18n="file_choose">Choose file...</span>
                            </div>
                            <input type="file" name="screenshot" accept="image/*" class="hidden" onchange="updateFileName(this)">
                        </label>
                    </div>
                </div>

                <!-- ნოტები / კომენტარი -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="label_notes">Notes / Strategy</label>
                    <textarea name="notes" rows="3" placeholder="Why did you open this trade?" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition" data-i18n-placeholder="notes_placeholder"></textarea>
                </div>

                <!-- ღილაკები -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/5">
                    <a href="{{ url_for('index') }}" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 text-xs sm:text-sm font-medium transition" data-i18n="btn_cancel">Cancel</a>
                    <button type="submit" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> <span data-i18n="btn_save">Save Trade</span>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- სკრიპტები -->
    <script>
        lucide.createIcons();

        // ენების ლექსიკონი
        const translations = {
            en: {
                page_title: "YourStats - Add Trade",
                nav_dashboard: "Dashboard",
                nav_history: "History",
                nav_analytics: "Analytics",
                btn_back: "Back",
                form_heading: "Add New Trade",
                form_subtitle: "Enter trade operation details for analysis.",
                label_date: "Date",
                label_pair: "Trading Pair (e.g., EURUSD, BTCUSD)",
                label_direction: "Direction",
                label_entry: "Entry Price",
                label_exit: "Exit Price",
                label_pnl: "Profit / Loss ($)",
                label_screenshot: "Screenshot (Image)",
                file_choose: "Choose file...",
                label_notes: "Notes / Strategy",
                notes_placeholder: "Why did you open this trade? What conclusion did you make?",
                btn_cancel: "Cancel",
                btn_save: "Save Trade"
            },
            ka: {
                page_title: "YourStats - ტრეიდის დამატება",
                nav_dashboard: "Dashboard",
                nav_history: "History",
                nav_analytics: "Analytics",
                btn_back: "უკან",
                form_heading: "ახალი ტრეიდის დამატება",
                form_subtitle: "შეიყვანეთ სავაჭრო ოპერაციის დეტალები აღმოსაჩენად.",
                label_date: "თარიღი",
                label_pair: "სავაჭრო წყვილი (მაგ: EURUSD, BTCUSD)",
                label_direction: "მხარე",
                label_entry: "შესვლის ფასი",
                label_exit: "გასვლის ფასი",
                label_pnl: "მოგება / წაგება ($)",
                label_screenshot: "სქრინშოტი (სურათი)",
                file_choose: "აირჩიეთ ფაილი...",
                label_notes: "კომენტარი / სტრატეგია",
                notes_placeholder: "რატომ გახსენი ტრეიდი? რა დასკვნა გამოიტანე?",
                btn_cancel: "გაუქმება",
                btn_save: "ტრეიდის შენახვა"
            },
            ru: {
                page_title: "YourStats - Добавить сделку",
                nav_dashboard: "Dashboard",
                nav_history: "History",
                nav_analytics: "Analytics",
                btn_back: "Назад",
                form_heading: "Добавить новую сделку",
                form_subtitle: "Введите детали торговой операции для анализа.",
                label_date: "Дата",
                label_pair: "Торговая пара (например, EURUSD, BTCUSD)",
                label_direction: "Направление",
                label_entry: "Цена входа",
                label_exit: "Цена выхода",
                label_pnl: "Прибыль / Убыток ($)",
                label_screenshot: "Скриншот (изображение)",
                file_choose: "Выберите файл...",
                label_notes: "Заметки / Стратегия",
                notes_placeholder: "Почему вы открыли эту сделку? Какой вывод сделали?",
                btn_cancel: "Отмена",
                btn_save: "Сохранить сделку"
            },
            es: {
                page_title: "YourStats - Añadir Operación",
                nav_dashboard: "Dashboard",
                nav_history: "History",
                nav_analytics: "Analytics",
                btn_back: "Volver",
                form_heading: "Añadir Nueva Operación",
                form_subtitle: "Introduce los detalles de la operación para su análisis.",
                label_date: "Fecha",
                label_pair: "Par de trading (ej. EURUSD, BTCUSD)",
                label_direction: "Dirección",
                label_entry: "Precio de entrada",
                label_exit: "Precio de salida",
                label_pnl: "Beneficio / Pérdida ($)",
                label_screenshot: "Captura de pantalla (Imagen)",
                file_choose: "Elegir archivo...",
                label_notes: "Notas / Estrategia",
                notes_placeholder: "¿Por qué abriste esta operación? ¿Qué conclusión sacaste?",
                btn_cancel: "Cancelar",
                btn_save: "Guardar Operación"
            }
        };

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function toggleLangMenu() {
            const dropdown = document.getElementById('langDropdown');
            dropdown.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const button = document.getElementById('langMenuButton');
            const dropdown = document.getElementById('langDropdown');
            if (button && dropdown && !button.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        function changeLanguage(lang) {
            const labels = {
                'en': 'English',
                'ka': 'ქართული',
                'ru': 'Русский',
                'es': 'Español'
            };
            const labelEl = document.getElementById('currentLangLabel');
            if(labelEl) labelEl.innerText = labels[lang] || 'English';
            
            const dropdown = document.getElementById('langDropdown');
            if(dropdown) dropdown.classList.add('hidden');
            
            localStorage.setItem('selected_language', lang);
            applyTranslations(lang);
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerText = t[key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });

            if(t.page_title) document.title = t.page_title;
        }

        function updateFileName(input) {
            const fileNameSpan = document.getElementById('fileName');
            const savedLang = localStorage.getItem('selected_language') || 'en';
            const defaultChooseText = translations[savedLang]?.file_choose || "Choose file...";
            
            if (input.files && input.files[0]) {
                fileNameSpan.textContent = input.files[0].name;
                fileNameSpan.classList.add('text-white');
            } else {
                fileNameSpan.textContent = defaultChooseText;
                fileNameSpan.classList.remove('text-white');
            }
        }

        // გვერდის ჩატვირთვისას ავტომატურად ძებნა და შენახული ენის მორგება
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selected_language') || 'en';
            const labels = {
                'en': 'English',
                'ka': 'ქართული',
                'ru': 'Русский',
                'es': 'Español'
            };
            const labelEl = document.getElementById('currentLangLabel');
            if (labelEl && labels[savedLang]) {
                labelEl.innerText = labels[savedLang];
            }
            applyTranslations(savedLang);
        });
    </script>
</body>
</html>
