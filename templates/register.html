<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YourStats - რეგისტრაცია</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Glassmorphism Panel with Ambient Shadow */
        .glass-panel {
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.05);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #E879F9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Float & Background Animations */
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-subtle-float {
            animation: subtleFloat 5s ease-in-out infinite;
        }

        @keyframes pulseSlow {
            0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.65; transform: translate(-50%, -50%) scale(1.08); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(30px, -30px); }
        }

        @keyframes floatSlowReverse {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(-30px, 30px); }
        }

        .animate-pulse-slow {
            animation: pulseSlow 8s ease-in-out infinite;
        }

        .animate-float-slow {
            animation: floatSlow 12s ease-in-out infinite;
        }

        .animate-float-slow-reverse {
            animation: floatSlowReverse 14s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#05070B] text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden antialiased">

    <!-- Professional Background Layer -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none bg-[#05070B]">
        <!-- Subtle Grid Pattern -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>

        <!-- Animated Glowing Orbs -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-indigo-600/20 rounded-full blur-[130px] animate-pulse-slow"></div>
        <div class="absolute -bottom-20 -left-20 w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[120px] animate-float-slow"></div>
        <div class="absolute -top-20 -right-20 w-[500px] h-[500px] bg-pink-600/10 rounded-full blur-[120px] animate-float-slow-reverse"></div>

        <!-- Radial Vignette -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(5,7,11,0.8)_100%)]"></div>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-md space-y-6 relative z-10 animate-subtle-float">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-3">
            <div class="inline-flex relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur-md opacity-50 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative bg-gradient-to-br from-indigo-500 to-purple-600 p-3.5 rounded-2xl shadow-xl">
                    <i data-lucide="line-chart" class="w-8 h-8 text-white"></i>
                </div>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Your<span class="gradient-text">Stats</span></h1>
                <p class="text-xs text-gray-400 font-medium mt-1">Created by Sandrika</p>
            </div>
        </div>

        <!-- Glassmorphism Form Card -->
        <div class="glass-panel p-8 rounded-3xl relative overflow-hidden border border-white/10">
            
            <!-- Language Dropdown & Title -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/5">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <div class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                    </div>
                    <span data-i18n="register_title">ანგარიშის შექმნა</span>
                </h2>
                
                <div class="relative">
                    <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-black/50 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-indigo-500 cursor-pointer hover:bg-black/70 transition">
                        <option value="ka" class="bg-gray-900 text-white">🇬🇪 KA</option>
                        <option value="en" class="bg-gray-900 text-white">🇺🇸 EN</option>
                        <option value="ru" class="bg-gray-900 text-white">🇷🇺 RU</option>
                        <option value="es" class="bg-gray-900 text-white">🇪🇸 ES</option>
                    </select>
                </div>
            </div>

            <!-- Flask Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-5 p-3.5 rounded-xl text-xs font-medium border {% if category == 'error' %} bg-rose-500/10 border-rose-500/20 text-rose-400 {% else %} bg-emerald-500/10 border-emerald-500/20 text-emerald-400 {% endif %} flex items-center gap-2">
                            <i data-lucide="{% if category == 'error' %}alert-circle{% else %}check-circle{% endif %}" class="w-4 h-4 shrink-0"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Register Form -->
            <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
                
                <!-- Username Field -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider" data-i18n="username">მომხმარებლის სახელი</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" name="username" required class="w-full bg-black/40 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder-gray-600" placeholder="Username">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider" data-i18n="password">პაროლი</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="password" required class="w-full bg-black/40 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder-gray-600" placeholder="••••••••">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full mt-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3.5 px-4 rounded-xl text-sm transition-all duration-300 shadow-lg shadow-indigo-600/25 hover:shadow-indigo-600/40 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2" data-i18n="register_btn">
                    <span>რეგისტრაცია</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 pt-5 border-t border-white/5 text-center text-xs text-gray-400 flex items-center justify-center gap-1">
                <span data-i18n="already_have_account">უკვე გაქვს ანგარიში?</span>
                <a href="{{ url_for('login') }}" class="text-indigo-400 hover:text-indigo-300 font-bold hover:underline transition ml-1" data-i18n="login_link">შესვლა</a>
            </div>
        </div>
    </div>

    <!-- Script Block -->
    <script>
        lucide.createIcons();

        // ენების თარგმანების ლექსიკონი
        const translations = {
            ka: {
                page_title: "YourStats - რეგისტრაცია",
                register_title: "ანგარიშის შექმნა",
                username: "მომხმარებლის სახელი",
                password: "პაროლი",
                register_btn: "რეგისტრაცია",
                already_have_account: "უკვე გაქვს ანგარიში?",
                login_link: "შესვლა"
            },
            en: {
                page_title: "YourStats - Register",
                register_title: "Create Account",
                username: "Username",
                password: "Password",
                register_btn: "Register",
                already_have_account: "Already have an account?",
                login_link: "Sign In"
            },
            ru: {
                page_title: "YourStats - Регистрация",
                register_title: "Создать аккаунт",
                username: "Имя пользователя",
                password: "Пароль",
                register_btn: "Регистрация",
                already_have_account: "Уже есть аккаунт?",
                login_link: "Войти"
            },
            es: {
                page_title: "YourStats - Registro",
                register_title: "Crear Cuenta",
                username: "Nombre de usuario",
                password: "Contraseña",
                register_btn: "Registrarse",
                already_have_account: "¿Ya tienes una cuenta?",
                login_link: "Iniciar sesión"
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selected_language', lang);
            document.getElementById('languageSelect').value = lang;

            if (translations[lang] && translations[lang].page_title) {
                document.title = translations[lang].page_title;
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    const textSpan = element.querySelector('span');
                    if (textSpan) {
                        textSpan.innerText = translations[lang][key];
                    } else {
                        element.innerText = translations[lang][key];
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selected_language') || 'ka';
            changeLanguage(savedLang);
        });
    </script>
</body>
</html>
