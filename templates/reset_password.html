<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ახალი პაროლის დაყენება - YourStats</title>
    <!-- მიუსადაგე შენი არსებული დიზაინის CSS სტილები -->
</head>
<body>
    <div class="auth-container">
        <h2>ახალი პაროლის მითითება</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>ახალი პაროლი</label>
                <input type="password" name="password" required class="form-control" placeholder="შეიყვანე ახალი პაროლი">
            </div>

            <button type="submit" class="btn-primary">პაროლის შენახვა</button>
        </form>
    </div>
</body>
</html>
