<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YourStats - შესვლა</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-panel {
            background: rgba(17, 21, 31, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; background-color: #05070B;
        }
    </style>
</head>
<body class="bg-transparent text-gray-300 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
    <div class="app-background"></div>

    <div class="w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex bg-gradient-to-br from-indigo-500 to-purple-600 p-3 rounded-2xl shadow-xl shadow-indigo-500/20 mb-2">
                <i data-lucide="line-chart" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Your<span class="gradient-text">Stats</span></h1>
            <p class="text-xs text-gray-400 font-medium">Created by Sandrika</p>
        </div>

        <div class="glass-panel p-8 rounded-3xl relative overflow-hidden">
            <!-- ენის ჩამოსაშლელი მენიუ -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5 text-indigo-400"></i>
                    <span data-i18n="login_title">სისტემაში შესვლა</span>
                </h2>
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-black/50 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-indigo-500 cursor-pointer hover:bg-black/70 transition">
                    <option value="ka" class="bg-gray-900 text-white">🇬🇪 KA</option>
                    <option value="en" class="bg-gray-900 text-white">🇺🇸 EN</option>
                    <option value="ru" class="bg-gray-900 text-white">🇷🇺 RU</option>
                    <option value="es" class="bg-gray-900 text-white">🇪🇸 ES</option>
                </select>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-5 p-3.5 rounded-xl text-xs font-medium border {% if category == 'error' %} bg-danger/10 border-danger/20 text-red-400 {% else %} bg-emerald-500/10 border-emerald-500/20 text-emerald-400 {% endif %} flex items-center gap-2">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="username">მომხმარებლის სახელი</label>
                    <input type="text" name="username" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5" data-i18n="password">პაროლი</label>
                    <input type="password" name="password" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30" data-i18n="login_btn">შესვლა</button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/5 text-center text-xs text-gray-400">
                <span data-i18n="no_account">არ გაქვს ანგარიში?</span>
                <a href="{{ url_for('register') }}" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1" data-i18n="register">რეგისტრაცია</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ენების თარგმანების ლექსიკონი
        const translations = {
            ka: {
                page_title: "YourStats - შესვლა",
                login_title: "სისტემაში შესვლა",
                username: "მომხმარებლის სახელი",
                password: "პაროლი",
                login_btn: "შესვლა",
                no_account: "არ გაქვს ანგარიში?",
                register: "რეგისტრაცია"
            },
            en: {
                page_title: "YourStats - Login",
                login_title: "Sign In",
                username: "Username",
                password: "Password",
                login_btn: "Sign In",
                no_account: "Don't have an account?",
                register: "Register"
            },
            ru: {
                page_title: "YourStats - Вход",
                login_title: "Вход в систему",
                username: "Имя пользователя",
                password: "Пароль",
                login_btn: "Войти",
                no_account: "Нет аккаунта?",
                register: "Регистрация"
            },
            es: {
                page_title: "YourStats - Iniciar sesión",
                login_title: "Iniciar sesión",
                username: "Nombre de usuario",
                password: "Contraseña",
                login_btn: "Entrar",
                no_account: "¿No tienes una cuenta?",
                register: "Registrarse"
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selected_language', lang);
            document.getElementById('languageSelect').value = lang;

            if (translations[lang] && translations[lang].page_title) {
                document.title = translations[lang].page_title;
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selected_language') || 'ka';
            changeLanguage(savedLang);
        });
    </script>
</body>
</html>
