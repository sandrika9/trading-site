<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>პაროლის აღდგენა</title>
</head>
<body>
    <div class="container">
        <!-- ფლეშ შეტყობინებების გამოჩენა -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% if token %}
            <!-- თუ მომხმარებელი გადმოვიდა მეილის ბმულიდან -->
            <h2>ახალი პაროლის მითითება</h2>
            <form method="POST">
                <input type="password" name="password" placeholder="შეიყვანეთ ახალი პაროლი" required>
                <button type="submit">პაროლის შეცვლა</button>
            </form>
        {% else %}
            <!-- თუ ითხოვს აღდგენას (შეჰყავს მეილი) -->
            <h2>პაროლის აღდგენა</h2>
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <input type="email" name="email" placeholder="შეიყვანეთ თქვენი რეგისტრირებული მეილი" required>
                <button type="submit">აღდგენის ინსტრუქციის გაგზავნა</button>
            </form>
            <p><a href="{{ url_for('login') }}">ავტორიზაციაზე დაბრუნება</a></p>
        {% endif %}
    </div>
</body>
</html>
