<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>პაროლის აღდგენა - YourStats</title>
    <!-- მიუსადაგე შენი არსებული დიზაინის CSS სტილები -->
</head>
<body>
    <div class="auth-container">
        <h2>პაროლის აღდგენა</h2>
        <p>შეიყვანე შენი ელ-ფოსტა და გამოგიგზავნით პაროლის შეცვლის ინსტრუქციას.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>ელ-ფოსტა (Email)</label>
                <input type="email" name="email" required class="form-control" placeholder="შეიყვანე მეილი">
            </div>

            <button type="submit" class="btn-primary">აღდგენის ბმულის მიღება</button>
        </form>

        <p><a href="{{ url_for('login') }}">← უკან შესვლაზე</a></p>
    </div>
</body>
</html>
